<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C4161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="조져 — 오늘 무슨 날인지 적고, 부위를 고르고, 머신 사진 보며 세트를 기록하는 헬스 로그">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>조져</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 포스터형 (빨강 + 검정): 위쪽 구역(헤더, 홈 날짜, 머신 이름)은 빨강에 크림 글씨, 아래 본문은 검정에 크림 글씨, 번호와 강조만 밝은 빨강. 카드와 둥근 모서리 없이 굵은 줄과 큰 숫자로 구분. */
:root{
  --bg:#141011; --paper:#F2E8DA; --ink:#F2E8DA; --dark:#141011; --red:#C4161C; --hot:#FF3B3B; --pink:#F5C3BF; --muted:#A8999A; --faint:#6E6061; --cream:#F2E8DA; --raise:#2A2223;
  --accent:var(--red); --fg:var(--ink); --line:var(--ink); --surface:transparent; --surface2:var(--paper); --accent-fg:#fff; --good:var(--red); --accent2:var(--red); --imgbg:transparent;
  --display:"Big Shoulders Display","Gothic A1",sans-serif;
  --logo:"Black Han Sans","Gothic A1",sans-serif;
  --body:"Gothic A1","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --rule:2.5px solid #4A3A3B; --thick:6px solid #4A3A3B; --pad:max(16px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 8px;min-height:56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--logo);font-size:24px;line-height:1;letter-spacing:-.5px}
.back{font-weight:800;font-size:15px;padding:6px 10px 6px 0;flex-shrink:0}
.back:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top .title{font-family:var(--logo);font-size:22px;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .right{margin-left:auto;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.unitbtn{margin-left:auto;flex-shrink:0;display:flex;border:2.5px solid var(--ink)}
.unitbtn span{font-family:var(--display);font-weight:900;font-size:16px;line-height:1.3;padding:0 10px}
.unitbtn span.on{background:var(--ink);color:var(--bg)}
main{flex:1;padding-block:6px 0;display:flex;flex-direction:column;gap:20px}
main>:last-child:not(.slab){margin-bottom:28px}
h2{font-family:var(--logo);font-weight:400;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.eyebrow,.plabel{font-size:13px;font-weight:800}
.muted{color:var(--muted)}
.pill{font-size:12px;font-weight:800;white-space:nowrap}
.pill.acc2{color:var(--red)}
.primary{background:var(--red);color:#fff;font-weight:800;font-size:17px;padding:14px;text-align:center}
.primary[disabled]{opacity:.35;pointer-events:none}
.ghost{border:2.5px solid var(--ink);padding:12px;text-align:center;font-weight:800}
.ghost.sm,.primary.sm{padding:7px 12px;font-size:13px}
.empty{border-bottom:var(--rule);padding:18px 0;color:var(--muted);font-size:14px}
.linkbtn,.reallink{color:var(--ink);font-size:13px;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* 홈 */
.home{display:flex;flex-direction:column}
.bigdate{font-family:var(--display);font-weight:900;color:var(--red);line-height:1;letter-spacing:-.03em;margin:0 0 0 -6px;white-space:nowrap;height:auto}
.bigdate span{display:inline-block;font-size:150px}
.dow{font-weight:800;font-size:15px;margin-top:2px}
.dayinput{margin-top:22px;width:100%;background:none;border:0;border-bottom:var(--rule);padding:2px 0 4px;font-family:var(--logo);font-size:clamp(44px,15vw,72px);line-height:1.1;letter-spacing:-.02em}
.dayinput:focus{outline:none;border-bottom-color:var(--red)}
.dayinput::placeholder{color:var(--faint);font-size:.6em}
.quick{display:flex;gap:6px 14px;flex-wrap:wrap}
.home .quick{margin-top:10px}
.home .quick button{font-size:14px;font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.partsbtn{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:16px;text-align:left;font-weight:800;font-size:17px}
.partsbtn span{border-bottom:3px solid var(--ink);padding-bottom:1px}
.partsbtn em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:auto}
.home .primary{margin-top:16px}
.ghead2{display:flex;justify-content:space-between;align-items:baseline;border-top:var(--thick);padding-top:8px}
.exlist{display:flex;flex-direction:column}
.excard{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;align-items:start;gap:4px 8px;padding:10px 0 9px;border-bottom:var(--rule);text-align:left;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:var(--bg)}
.excard[data-open]{cursor:pointer}
.excard .num{font-family:var(--display);font-weight:900;font-size:50px;line-height:.82}
.excard .exname{font-weight:800;font-size:21px;line-height:1.18;overflow-wrap:anywhere}
.excard .exbrand{font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.excard .exsets{display:flex;flex-wrap:wrap;gap:0 10px;margin-top:5px;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
.excard .gband{font-size:12px;font-weight:800;color:var(--red)}
.excard .exside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.excard .exside b{font-family:var(--display);font-weight:900;font-size:24px;line-height:1;white-space:nowrap}
.excard .img{width:58px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.excard img,.excard svg{-webkit-user-drag:none;pointer-events:none}
.exdel{width:30px;height:30px;font-size:22px;line-height:1;font-weight:800;display:grid;place-items:center;margin-top:-4px}
.exdel.arm{width:auto;padding:0 8px;background:var(--red);color:#fff;font-size:12px}
.excard.dragging{z-index:5;background:var(--paper);box-shadow:0 10px 24px -10px rgba(0,0,0,.6);cursor:grabbing}
.excard.sel{background:var(--paper);box-shadow:inset 6px 0 0 var(--red);padding-left:12px}
.excard.add{grid-template-columns:44px 1fr;align-items:center;width:100%;font-weight:800;font-size:17px;color:var(--muted);cursor:pointer;touch-action:auto}
.excard.add .plus{font-family:var(--display);font-weight:900;font-size:44px;line-height:.82;color:var(--red)}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;font-size:13px;font-weight:800}
.selbar .row2{display:flex;gap:6px}
.list{display:flex;flex-direction:column;border-top:var(--thick)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:10px 0 8px;border-bottom:var(--rule);text-align:left}
.row .pd{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;min-width:58px}
.row .grow{min-width:0}
.row .t{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted)}
.row .kg{font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap}
.slab{position:sticky;bottom:0;z-index:4;margin:auto calc(-1*var(--pad)) 0;padding:16px var(--pad) calc(18px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;font-family:var(--display);font-weight:900;font-size:34px;line-height:1.05;letter-spacing:.01em;text-align:left;display:block;width:auto}
button.slab{width:calc(100% + 2*var(--pad))}
.slab small{display:block;font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:0;color:#F3CFD0;margin-top:3px;white-space:pre-wrap}
.slab.done{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink)}
.slab.done small{color:#bbb}
.slab .col{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.slab .col button{font-family:var(--body);font-size:12.5px;font-weight:800;border:2px solid #fff;padding:6px 10px;color:#fff}

/* 부위, 종목 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:2.5px solid var(--ink);padding:5px 12px;font-size:14px;font-weight:800;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"],.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.big{padding:10px 18px;font-size:18px}
.pgroup{display:flex;flex-direction:column;gap:8px;border-top:var(--rule);padding-top:10px}
.toolbar{display:flex;gap:8px}
.toolbar .search{flex:1;min-width:0}
.search,.brandsel{background:var(--paper);border:2.5px solid var(--ink);padding:10px 12px;font-size:15px}
.search{width:100%}
.brandsel{max-width:40%;font-size:13px;font-weight:800}
.results{display:flex;flex-direction:column;gap:26px}
.gsec{display:flex;flex-direction:column;gap:12px}
.ghead{display:flex;align-items:baseline;gap:10px;border-top:6px solid var(--red);padding-top:6px}
.ghead h2{font-size:38px;color:var(--red)}
.count{font-size:13px;font-weight:800;color:var(--muted)}
.more{font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px}
.mcard{text-align:left;display:flex;flex-direction:column;min-width:0;border-top:var(--rule)}
.img{background:transparent}
.img img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:multiply}
.mcard .img{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden;position:relative}
.img.ico svg{width:58%;height:58%;color:var(--ink)}
.img .ph{font-family:var(--display);font-weight:900;font-size:40px;color:var(--faint)}
.img.broken::after{content:attr(data-ph);font-family:var(--display);font-weight:900;font-size:34px;color:var(--faint)}
.img.typo{background:linear-gradient(160deg,#3f9fe0 0%,#1f6fc2 100%)!important;position:relative;display:grid!important;place-items:center}
.img.typo svg{width:76%!important;height:76%!important;margin-top:12%;fill:none;stroke:#fff;color:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.img.typo svg .thin{stroke-width:1.6;opacity:.75}.img.typo svg .pad{stroke-width:7}.img.typo svg .mv{stroke-width:4}
.img.typo .tlabel{position:absolute;top:7%;left:8%;right:6%;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 5px;color:#fff;line-height:1}
.img.typo .tlabel small{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.16em;opacity:.9}
.img.typo .tlabel b{font-family:var(--display);font-size:14px;letter-spacing:.06em}
.excard .img.typo .tlabel{display:none}
.hero .img.typo .tlabel small{font-size:8px}.hero .img.typo .tlabel b{font-size:11px}
.mcard .meta{padding:4px 0 0;display:flex;flex-direction:column;gap:2px}
.mcard .name{font-weight:800;font-size:16px;line-height:1.22;overflow-wrap:anywhere}
.mcard .sub{font-size:11.5px;color:var(--muted)}
.mcard .last{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mcard .last b{color:var(--red);font-weight:800}

/* 기록 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 40%;gap:8px;align-items:end}
.hero .info{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.hero .hbrand{font-weight:800;font-size:13px}
.hero h2{font-family:"Big Shoulders Display","Black Han Sans","Gothic A1",sans-serif;font-weight:900;font-size:clamp(34px,11.5vw,50px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase;color:var(--red);overflow-wrap:anywhere}
.hero .hmeta{font-size:12.5px;color:var(--muted)}
.heroimg{position:relative;display:flex;flex-direction:column;align-items:flex-end;cursor:pointer}
.hero .img{width:100%;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.camtag{font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px;color:var(--muted);margin-top:2px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gtag{font-size:13px;font-weight:800;color:var(--red)}
.lastlist{display:flex;flex-direction:column;border-top:var(--thick);padding-top:8px}
.lastlist .empty{border-top:0;margin-top:0;padding:10px 0}
.lastrow{border-bottom:var(--rule);padding:8px 0;text-align:left;display:flex;flex-direction:column;gap:2px}
.lastrow .lh{font-size:13px;display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.lastrow .lsets{display:flex;gap:0 12px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.lastrow .lsets em{display:none}
.lastlist .linkbtn{align-self:flex-start;margin-top:8px}
.setlist{display:flex;flex-direction:column;border-top:var(--rule)}
.setlist .empty{border-top:0}
.set{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:10px;padding:4px 0 2px;border-bottom:var(--rule);font-variant-numeric:tabular-nums}
.set .idx{font-size:13px;font-weight:800;min-width:38px}
.set .v{font-family:var(--display);font-weight:900;font-size:clamp(40px,13vw,56px);line-height:1;letter-spacing:-.01em;min-width:0}
.set .v em{display:block;font-style:normal;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:0;color:var(--muted);margin:1px 0 4px}
.set .del{font-size:24px;font-weight:800;padding:0 4px;align-self:center}
.sheet{display:flex;flex-direction:column;gap:12px}
.sheet.entry{margin-inline:calc(-1*var(--pad));padding:16px var(--pad) 20px;background:var(--ink);color:var(--cream);--line:var(--cream);--muted:#B5AEA3}
.seg{display:flex;border:2px solid var(--line)}
.seg button{flex:1;padding:8px 4px;font-size:13.5px;font-weight:800}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--bg)}
.sheet.entry .seg button[aria-pressed="true"]{color:var(--ink)}
.unitrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.unitseg{flex:0 0 auto;min-width:190px}
.plates{display:flex;flex-direction:column;gap:10px}
.plates .prow{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:2px solid var(--line);padding:6px 0;font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1;min-width:44px;flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.pbtn small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted)}
.pbtn .cnt{background:var(--red);color:#fff;font-size:12px;font-family:var(--body);font-weight:800;padding:0 7px;min-width:18px}
.pbtn.on{background:var(--line);color:var(--ink)}
.barrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barrow .lbl{font-size:13px;font-weight:800;flex-shrink:0}
.sheet.entry .quick{gap:6px}
.sheet.entry .quick button{border:2px solid var(--line);padding:3px 10px;font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.sheet.entry .quick button.on{background:var(--line);color:var(--ink)}
.calc{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.calc .big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.calc .big small{font-size:22px;margin-left:3px}
.calc .formula{font-size:12px;color:var(--muted);text-align:right;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.one{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .inp{display:flex;align-items:center;background:var(--paper);color:var(--ink);overflow:hidden;min-width:0}
.field input[type=number]{flex:1;min-width:0;width:0;background:none;border:0;padding:0 2px 4px;font-family:var(--display);font-weight:900;font-size:52px;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none}
.step{width:40px;align-self:stretch;font-size:24px;font-weight:800;flex-shrink:0}
.sheet.entry .primary{background:var(--red);color:#fff;font-family:var(--logo);font-weight:400;font-size:24px;padding:11px}
.sheet.entry .ghost{border-color:var(--cream)}
main>.fields .primary,main>.fields .ghost{font-size:14.5px;padding:12px 8px}

/* 추가, 평점 */
.form input[type=text],.form select,.cmtin{width:100%;background:var(--paper);border:2.5px solid var(--ink);padding:11px 12px;font-size:15px}
.cmtin{resize:vertical}
.form .photo{border:2.5px dashed var(--ink);padding:14px;text-align:center;font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.form .photo img{max-height:160px}
.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rating button{border:2.5px solid var(--ink);padding:6px 0;font-family:var(--display);font-weight:900;font-size:26px}
.rating button[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.sessmeta{display:grid;grid-template-columns:repeat(3,1fr);border-top:var(--thick);border-bottom:var(--rule)}
.sessmeta div{display:flex;flex-direction:column;padding:8px 0}
.sessmeta b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.sheet .cmt{font-size:15px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 16px;font-size:14px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.show{opacity:1}
.notice{font-size:11.5px;color:var(--muted);padding:14px 0 18px;line-height:1.6}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.exside b i,.row .kg i{font-style:normal;font-family:var(--body);font-weight:800;font-size:.58em;letter-spacing:0;margin-left:3px}
.top .title{color:var(--red)}
.brand,h2{color:var(--red)}
.dayinput{color:var(--red)}

/* ---- 빨강 + 검정 구역 ---- */
header.top{margin-inline:calc(-1*var(--pad));padding-inline:var(--pad);background:var(--red)}
body::before{background:var(--red)}
.brand,.top .title{color:var(--cream)}
.unitbtn span.on{color:var(--red)}
:focus-visible{outline-color:var(--cream)!important}
main{padding-top:0}
main>:first-child:not(.home):not(.hero){margin-top:16px}
h2{color:var(--hot)}
.home,.hero{margin-inline:calc(-1*var(--pad));padding:0 var(--pad) 18px;background:var(--red)}
.bigdate{color:var(--cream)}
.dayinput{color:var(--cream);border-bottom-color:var(--cream)}
.dayinput:focus{border-bottom-color:var(--dark)}
.dayinput::placeholder{color:rgba(242,232,218,.55)}
.partsbtn em{color:var(--pink)}
.home .primary{background:var(--dark);color:var(--cream)}
.primary{color:var(--cream)}
.ghead2{border-top:0;padding-top:0}
.excard .num,.excard.add .plus,.row .pd,.excard .gband,.gtag,.pill.acc2,.mcard .last b{color:var(--hot)}
.excard .img,.mcard .img{background:var(--paper)}
.excard.dragging,.excard.sel{background:var(--raise)}
.list{border-top:var(--rule)}
.slab{color:var(--cream)}
.slab small{color:var(--pink)}
.slab.done{background:var(--raise)}
.slab .col button{border-color:var(--cream);color:var(--cream)}
.chip[aria-pressed="true"],.chip.on{color:var(--cream)}
.search,.brandsel,.cmtin,.form input[type=text],.form select,.field .inp{color:var(--dark)}
.search::placeholder,.cmtin::placeholder,.form input::placeholder{color:#7A6C66}
.ghead h2{color:var(--hot)}
.img.ico svg{color:var(--dark)}
.hero{padding-top:6px}
.hero h2,.hero .hbrand,.hero .linkbtn,.hero .reallink{color:var(--cream)}
.hero .hmeta,.camtag{color:var(--pink)}
.hero .img{background:transparent}
.hero .img:not(.mine):not(.typo) img{filter:grayscale(1) contrast(1.2)}
.hero .img.ico svg,.hero .img .ph{color:var(--cream)}
.img.mine img{mix-blend-mode:normal}
.lastlist{border-top:0;padding-top:0}
.set .idx{color:var(--muted)}
.sheet.entry{background:var(--red);--muted:var(--pink)}
.sheet.entry .seg button[aria-pressed="true"],.pbtn.on,.sheet.entry .quick button.on{color:var(--dark)}
.pbtn .cnt{background:var(--dark);color:var(--cream)}
.sheet.entry .primary{background:var(--dark);color:var(--cream)}
.rating button[aria-pressed="true"]{color:var(--cream)}
.toast{background:var(--cream);color:var(--dark)}
.brand,.top .title,.dayinput,h2{font-weight:400}
.dayinput{letter-spacing:0}
.set{padding:8px 0 4px}
.set .v em{margin:10px 0 4px}
.recrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.recrow:has(#addDrop){grid-template-columns:1.5fr 1fr}
.recrow .ghost{font-size:16px;padding:6px 8px;line-height:1.2;display:flex;flex-direction:column;justify-content:center}
.recrow .ghost small{font-size:11px;font-weight:600;color:var(--pink)}
.set.drop{padding:2px 0 2px 38px;border-bottom-style:dashed}
.set.drop .idx{color:var(--hot);min-width:34px}
.set.drop .v{font-size:clamp(26px,8.5vw,36px)}
.set.drop .del{font-size:20px}
.set:has(+.set.drop){border-bottom-style:dashed}
</style>
</head>

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(s && s.sessions) return migrate(s); } }catch(e){}
  return migrate(seed());
}
function migrate(s){
  for(const ses of s.sessions){ for(const [o,n] of Object.entries(OLD_IDS)){ if(ses.entries[o] && o!==n){ ses.entries[n]=(ses.entries[n]||[]).concat(ses.entries[o]); delete ses.entries[o]; } } }
  const mine=(s.machines||[]).filter(m=>!m.builtin && !(m.id in OLD_IDS) && !DEFAULT_IDS.has(m.id) && !/^(hs|nt|cy|tg|lf|na|nn|db|bb|cb|bw|sm)-/.test(m.id));
  s.machines=DEFAULT_MACHINES.map(m=>({...m})).concat(mine);
  for(const m of mine){ if(m.group==='팔') m.group='이두'; m.parts ||= [m.group]; }
  const legacy={push:["가슴","전면어깨","삼두"],pull:["등","이두","후면어깨"],legs:["대퇴사두","햄스트링","둔근","종아리"],chest:["가슴"],back:["등"],shoulder:["전면어깨","측면어깨","후면어깨"],arms:["이두","삼두"]};
  for(const ses of s.sessions){ ses.order ||= Object.keys(ses.entries); ses.groups ||= []; }
  const names={push:"Push Day",pull:"Pull Day",legs:"Leg Day",chest:"Chest Day",back:"Back Day",shoulder:"Shoulder Day",arms:"Arm Day"};
  for(const ses of s.sessions){ if(!ses.dayName){ ses.dayName=names[ses.dayType]||s.customDays?.find(d=>d.id===ses.dayType)?.name||ses.dayType||"운동"; ses.parts=legacy[ses.dayType]||[]; } ses.parts ||= []; }
  s.prefs ||= {brand:null}; s.prefs.unit ||= 'kg'; s.photos ||= {};
  return s;
}

function ymd(t){ return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
const TODAY = ymd(new Date());
function fmtDate(s){ const [y,m,d]=s.split("-"); const t=new Date(+y,+m-1,+d); const w="일월화수목금토"[t.getDay()]; return `${+m}/${+d} (${w})`; }
function todaySession(){ return state.sessions.find(s=>s.date===TODAY); }
function groupOf(ses,id){ return (ses.groups||[]).find(g=>g.ids.includes(id)); }
function groupLabel(ses,g){ const i=(ses.groups||[]).indexOf(g); return (g.ids.length>=3?"자이언트세트":"슈퍼세트")+" "+String.fromCharCode(65+i); }
function fmtDur(ms){ const m=Math.floor(ms/60000), h=Math.floor(m/60); return h?`${h}시간 ${m%60}분`:`${m}분`; }
function orderedIds(ses){ const ids=Object.keys(ses.entries).filter(k=>ses.entries[k].length); const ord=(ses.order||[]).filter(id=>ids.includes(id)); return ord.concat(ids.filter(id=>!ord.includes(id))); }
function machineById(id){ return state.machines.find(m=>m.id===id); }
function unit(){ return state.prefs?.unit==="lb" ? "lb" : "kg"; }
function toUnit(kg){ return unit()==="lb" ? Math.round(kg/LB*10)/10 : Math.round(kg*100)/100; }
function fromUnit(v){ return unit()==="lb" ? Math.round(v*LB*100)/100 : v; }
function fmtW(kg){ return `${toUnit(kg)}${unit()}`; }
function matchQ(m,q){ const ql=norm(q); if(!ql) return true; const hay=norm(m.name)+" "+norm(m.ko||"")+" "+norm(m.parts.join(" ")); if(hay.includes(ql)) return true; for(const [k,re] of SLANG){ if(ql.length>=2 && (k===ql || (ql.length>=3 && k.includes(ql)) || ql.includes(k) && k.length>=2 && Math.abs(ql.length-k.length)<=1) && re.test(hay)) return true; } return false; }
function norm(s){ return String(s).toLowerCase().replace(/[\s\-_/·()]/g,""); }
function imgOf(m){ return (state.photos&&state.photos[m.id]) || m.img || (m.imgKey && IMG[m.imgKey]) || null; }
function lastEntryFor(mid, beforeDate){
  const ss = state.sessions.filter(s=>s.entries[mid]?.length && (!beforeDate || s.date<beforeDate)).sort((a,b)=>a.date<b.date?1:-1);
  return ss[0] ? {date:ss[0].date, sets:ss[0].entries[mid]} : null;
}
function summarize(sets){
  const parts=[]; let cur=null;
  for(const s of sets){ if(s.drops?.length){ parts.push({txt:setTxt(s)}); cur=null; } else if(cur && cur.kg===s.kg) cur.reps.push(s.reps); else { cur={kg:s.kg,reps:[s.reps]}; parts.push(cur);} }
  return parts.map(p=>p.txt||`${p.kg===0?"맨몸":fmtW(p.kg)} × ${p.reps.join(", ")}`).join(", ");
}
function bestKg(sets){ return Math.max(...sets.map(s=>s.kg)); }
function wr(st){ return `${st.kg===0?"맨몸":fmtW(st.kg)}×${st.reps}`; }
function setTxt(st){ return wr(st)+(st.drops?.length?st.drops.map(d=>` › ${wr(d)}`).join(""):""); }
function sideLabel(s){ return s.side==="총" ? "총 무게" : s.side==="덤벨" ? "한쪽" : s.side==="케이블" ? "스택" : s.side==="맨몸" ? "맨몸" : s.side; }
function plateText(plates){ const map={}; for(const p of plates){ const k=toUnit(p); map[k]=(map[k]||0)+1; } return Object.keys(map).sort((a,b)=>b-a).map(p=>`${p}×${map[p]}장`).join(" + "); }
function setDetail(s){
  if(s.side==="총") return `${s.bar?`봉 ${toUnit(s.bar)}`:"봉 제외"}${s.plates?.length?` + 한쪽 ${plateText(s.plates)}`:""}`;
  if(s.side==="맨몸") return s.kg>0?"추가 중량":s.kg<0?"보조":"맨몸";
  if(s.side==="덤벨") return "한쪽";
  if(s.side==="케이블") return "스택";
  return s.side + (s.plates?.length?`, ${plateText(s.plates)}`:"");
}

// 길게 눌러서 드래그로 순서 바꾸기 (터치/마우스 공통)
function enableDrag(strip, ses){
  if(!strip) return;
  let card=null, startX=0, startY=0, timer=null, dragging=false;
  const cards=()=>[...strip.querySelectorAll(".excard[data-id]")];
  const setT=y=>{ card.style.transform=`translateY(${y-startY}px)`; };
  strip.addEventListener("dragstart",e=>e.preventDefault());
  strip.addEventListener("contextmenu",e=>{ if(e.target.closest(".excard[data-id]")) e.preventDefault(); });
  strip.addEventListener("touchmove",e=>{ if(dragging) e.preventDefault(); },{passive:false});
  strip.addEventListener("pointerdown",e=>{
    const c=e.target.closest(".excard[data-id]"); if(!c||e.target.closest(".exdel")) return;
    card=c; startX=e.clientX; startY=e.clientY; dragging=false;
    timer=setTimeout(()=>{ dragging=true; card.classList.add("dragging"); if(navigator.vibrate) navigator.vibrate(15); },280);
  });
  strip.addEventListener("pointermove",e=>{
    if(!card) return;
    if(!dragging){ if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8){ clearTimeout(timer); card=null; } return; }
    e.preventDefault(); setT(e.clientY);
    const r=card.getBoundingClientRect(), mid=r.top+r.height/2;
    const before=cards().filter(c=>c!==card).find(c=>{ const q=c.getBoundingClientRect(); return mid<q.top+q.height/2; });
    const ref=before||strip.querySelector(".excard.add");
    if(ref!==card.nextElementSibling){ const t0=card.getBoundingClientRect().top; strip.insertBefore(card,ref); startY+=card.getBoundingClientRect().top-t0; setT(e.clientY); }
  });
  const end=()=>{ clearTimeout(timer); if(!card) return;
    if(dragging){ card.classList.remove("dragging"); card.style.transform=""; card.dataset.dragged="1"; ses.order=cards().map(c=>c.dataset.id); save(); cards().forEach((c,i)=>c.querySelector(".num").textContent=i+1); const c0=card; setTimeout(()=>{ delete c0.dataset.dragged; },50); }
    card=null; dragging=false; };
  const winMove=e=>{ if(card&&dragging&&!strip.contains(e.target)) strip.dispatchEvent(new PointerEvent("pointermove",{clientX:e.clientX,clientY:e.clientY,bubbles:true})); };
  window.__dragCleanup?.();
  window.addEventListener("pointerup",end); window.addEventListener("pointercancel",end); window.addEventListener("pointermove",winMove);
  window.__dragCleanup=()=>{ window.removeEventListener("pointerup",end); window.removeEventListener("pointercancel",end); window.removeEventListener("pointermove",winMove); };
}

// 검색 결과 영역만 다시 그림 (입력창은 건드리지 않아 한글 조합이 안 끊김)
function renderResults(){
  const ses=todaySession(); if(!ses) return;
  const brand = state.prefs.brand;
  const dayParts = ses.parts.length ? ses.parts : PARTS;
  const pool = state.machines.filter(m=>{
    if(brand==="__mine" ? m.builtin : brand && m.brand!==brand) return false;
    if(q) return matchQ(m,q);
    return true;
  }).sort((a,b)=>(BRAND_ORDER[a.brand]??9)-(BRAND_ORDER[b.brand]??9));
  // 검색 중에도 선택한 부위 칩을 우선 존중. 칩이 없으면 오늘 부위 그 외 부위 순서
  let sections;
  if(filterGroup) sections=[filterGroup];
  else if(q){ const hit=p=>pool.some(m=>(m.parts||[]).includes(p)); sections=[...dayParts.filter(hit), ...PARTS.filter(p=>!dayParts.includes(p)&&hit(p))]; }
  else sections=dayParts;
  let html=""; let total=0;
  for(const g of sections){
    const list = pool.filter(m=>(m.parts||[m.group]).includes(g)); if(!list.length) continue; total+=list.length;
    const open = expanded.has(g) || !!q || !!filterGroup;
    const shown = open ? list : list.slice(0,SHOW_N);
    html += `<section class="gsec"><div class="ghead"><h2>${esc(g)}</h2><span class="count">${list.length}개</span></div><div class="mgrid">`;
    for(const m of shown){
      const today = ses?.entries[m.id]?.length ? ses.entries[m.id] : null;
      const last = lastEntryFor(m.id, TODAY);
      const sub = today ? `<b>오늘 ${esc(summarize(today))}</b>` : last ? `지난번 ${fmtDate(last.date)}, ${esc(summarize(last.sets))}` : `아직 기록 없음`;
      html += `<button class="mcard" data-mid="${m.id}">${imgHtml(m)}<div class="meta"><div class="name">${esc(shortName(m))}</div><div class="sub">${esc(brandLabel(m))}${m.line?`, ${esc(m.line)}`:""}${m.ko?`, ${esc(m.ko.split(" | ")[0])}`:""}</div><div class="last">${sub}</div></div></button>`;
    }
    html += `</div>`;
    if(!open && list.length>SHOW_N) html += `<button class="ghost more" data-more="${g}">${esc(g)} ${list.length-SHOW_N}개 더 보기</button>`;
    html += `</section>`;
  }
  if(!total) html += `<div class="empty">${filterGroup?`"${esc(filterGroup)}"에는 해당 종목이 없어요, 위 칩에서 "오늘 부위 전체"를 눌러 다른 부위도 찾아보세요`:"해당하는 종목이 없어요"}</div>`;
  const box=$main.querySelector("#results"); box.replaceChildren(h(html));
  box.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{ expanded.add(b.dataset.more); renderResults(); }));
  box.querySelectorAll("[data-mid]").forEach(c=>c.addEventListener("click",()=>go({name:"log",mid:c.dataset.mid})));
}

    const step = draft.mode==="dumbbell" ? (isLb?5:1) : draft.mode==="body" ? (isLb?5:2.5) : m.stack ? (equip==="cable"?(isLb?5:2.5):(isLb?10:5)) : (isLb?5:2.5);
    const label = draft.mode==="dumbbell"?`덤벨 한쪽 무게 (${U})`:draft.mode==="body"?`추가 중량 (${U}), 보조면 −`:equip==="cable"?`스택 무게 (${U})`:`무게 (${U})`;
    wField = `<div class="field"><label for="kgIn">${label}</label><div class="inp"><button class="step" data-k="${-step}">−</button><input id="kgIn" type="number" inputmode="decimal" step="${step}" value="${draft.kg==null?"":toUnit(draft.kg)}" placeholder="0"><button class="step" data-k="${step}">+</button></div></div>`;
    if(draft.mode==="body") extra += `<button class="ghost" id="bwZero">맨몸 (0)</button>`;
    if(draft.mode==="dumbbell") extra += `<div class="quick" id="dbq">${(isLb?DB_QUICK_LB:DB_QUICK).map(w=>`<button data-w="${w}" class="${Math.abs(toUnit(draft.kg??-1)-w)<0.05?"on":""}">${w}</button>`).join("")}</div>`;
  }
  html += `<div class="fields ${wField?"":"one"}">${wField}<div class="field"><label for="repsIn">횟수</label><div class="inp"><button class="step" data-r="-1">−</button><input id="repsIn" type="number" inputmode="numeric" value="${draft.reps}"><button class="step" data-r="1">+</button></div></div></div>${extra}
    <div class="recrow"><button class="primary" id="addSet">세트 기록</button>${sets.length?`<button class="ghost" id="addDrop">드랍 추가<small>${sets.length}세트에 이어 붙임</small></button>`:""}</div></section>`;

  if(sets.length){
    const nextInGroup = g ? g.ids[(g.ids.indexOf(m.id)+1)%g.ids.length] : null;
    html += `<div class="fields">${nextInGroup&&nextInGroup!==m.id?`<button class="primary" id="nextG">다음: ${esc((machineById(nextInGroup)?.name||"").replace(/^(Hammer Strength|Life Fitness|Nautilus|Newtech|Cybex|Technogym) /,""))}</button>`:`<button class="ghost" id="nextEx2">다음 운동 고르기</button>`}<button class="ghost" id="toToday">오늘 기록 보기</button></div>`;
  }
  $main.replaceChildren(h(html));

  document.querySelector("#back").addEventListener("click",()=>go({name:"machines"}));
  $main.querySelectorAll("#unitSeg button").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.u===U) return; state.prefs.unit=b.dataset.u; save(); draft.mid=null; render(); toast(`단위: ${b.dataset.u}`); }));
  document.querySelector("#unitBtn").addEventListener("click",()=>{ state.prefs.unit = isLb?"kg":"lb"; save(); draft.mid=null; render(); toast(`단위: ${state.prefs.unit}`); });
  $main.querySelectorAll("[data-gm]").forEach(b=>b.addEventListener("click",()=>go({name:"log",mid:b.dataset.gm})));
  $main.querySelectorAll("[data-sess]").forEach(b=>b.addEventListener("click",()=>go({name:"session",date:b.dataset.sess})));
  $main.querySelector("#moreHist")?.addEventListener("click",()=>{ view.allHist=true; render(); });
  $main.querySelector("#photoIn").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; shrinkImage(f,480,url=>{ state.photos[m.id]=url; save(); toast("사진 바꿨어"); render(); }); });
  $main.querySelector("#photoDel")?.addEventListener("click",()=>{ delete state.photos[m.id]; save(); render(); });
  $main.querySelectorAll("#sideSeg button").forEach(b=>b.addEventListener("click",()=>{draft.side=b.dataset.s;render();}));
  $main.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.m==="kg"&&draft.mode==="plate") draft.kg=plateSum||draft.kg; draft.mode=b.dataset.m; render(); }));
  $main.querySelectorAll("#bars button").forEach(b=>b.addEventListener("click",()=>{ draft.bar=+b.dataset.bar; render(); }));
  $main.querySelectorAll("#dbq button").forEach(b=>b.addEventListener("click",()=>{ draft.kg=fromUnit(+b.dataset.w); render(); }));
  $main.querySelector("#bwZero")?.addEventListener("click",()=>{ draft.kg=0; render(); });
  $main.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.long){ delete b.dataset.long; return; } draft.plates.push(+b.dataset.p); draft.plates.sort((a,b)=>b-a); render(); }));
  $main.querySelector("#clearP")?.addEventListener("click",()=>{draft.plates=[];render();});
  const readKg=()=>{ const v=$main.querySelector("#kgIn")?.value; return v===""||v==null ? null : fromUnit(+v); };
  $main.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{ const cur=toUnit(readKg()??0); const nv=Math.round((cur+(+b.dataset.k))*100)/100; draft.kg=fromUnit(draft.mode==="body"?nv:Math.max(0,nv)); render(); }));
  $main.querySelector("#kgIn")?.addEventListener("input",()=>{ draft.kg=readKg(); });
  $main.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{ draft.reps=Math.max(1,(+($main.querySelector("#repsIn").value)||0)+(+b.dataset.r)); render(); }));
  $main.querySelector("#repsIn").addEventListener("input",e=>{ draft.reps=+e.target.value||0; });
  const record=(isDrop)=>{
    const reps=+($main.querySelector("#repsIn").value)||0;
    let w = draft.mode==="plate" ? plateSum : draft.mode==="barbell" ? Math.round((draft.bar+plateSum*2)*100)/100 : (readKg() ?? (draft.mode==="body"?0:null));
    if(draft.mode!=="body" && !w){ toast("무게를 넣어줘"); return; } if(!reps){ toast("횟수를 넣어줘"); return; }
    if(w==null) w=0;
    const rec = {kg:w, reps};
    if(draft.mode==="barbell"){ rec.side="총"; rec.bar=draft.bar; rec.plates=[...draft.plates]; }
    else if(draft.mode==="dumbbell"){ rec.side="덤벨"; }
    else if(draft.mode==="body"){ rec.side="맨몸"; }
    else if(equip==="cable"){ rec.side="케이블"; }
    else { rec.side=draft.side; rec.plates=draft.mode==="plate"?[...draft.plates]:[]; }
    draft.reps=reps;
    if(isDrop){
      const lastSet=sets[sets.length-1]; if(!lastSet) return;
      const prev=lastSet.drops?.length?lastSet.drops[lastSet.drops.length-1]:lastSet;
      if(w>=prev.kg){ toast("드랍은 앞 무게보다 가볍게 넣어줘"); return; }
      (lastSet.drops ||= []).push({kg:w, reps});
      // 다음 드랍을 위해 무게를 한 단계 낮춰둠
      if(draft.mode==="plate"||draft.mode==="barbell"){ if(draft.plates.length) draft.plates.pop(); }
      else { const stepV = draft.mode==="dumbbell" ? (isLb?5:1) : draft.mode==="body" ? (isLb?5:2.5) : m.stack ? (equip==="cable"?(isLb?5:2.5):(isLb?10:5)) : (isLb?5:2.5); const nv=Math.round((toUnit(w)-stepV)*100)/100; draft.kg=fromUnit(draft.mode==="body"?nv:Math.max(0,nv)); }
      save(); toast(`드랍 ${w===0?"맨몸":fmtW(w)} × ${reps} 붙였어`); render(); return;
    }
    sets.push(rec); ses.order ||= []; if(!ses.order.includes(m.id)) ses.order.push(m.id); save(); toast(`${w===0?"맨몸":fmtW(w)} × ${reps} 기록됨`); render();
  };
  $main.querySelector("#addSet").addEventListener("click",()=>record(false));
  $main.querySelector("#addDrop")?.addEventListener("click",()=>record(true));
  $main.querySelectorAll("[data-deldrop]").forEach(b=>b.addEventListener("click",()=>{ const [i,j]=b.dataset.deldrop.split(":").map(Number); sets[i].drops.splice(j,1); if(!sets[i].drops.length) delete sets[i].drops; save(); render(); }));
  $main.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{ sets.splice(+b.dataset.del,1); save(); render(); }));
  $main.querySelector("#nextEx2")?.addEventListener("click",()=>go({name:"machines"}));
  $main.querySelector("#nextG")?.addEventListener("click",()=>go({name:"log",mid:g.ids[(g.ids.indexOf(m.id)+1)%g.ids.length]}));
  $main.querySelector("#toToday")?.addEventListener("click",()=>go({name:"today"}));
}
function removePlate(p){ const i=draft.plates.indexOf(p); if(i>=0){draft.plates.splice(i,1);render();} }
// 플레이트 버튼 길게 누르면 제거
let pressTimer=null;
document.addEventListener("pointerdown",e=>{ const b=e.target.closest("[data-p]"); if(!b) return; pressTimer=setTimeout(()=>{ b.dataset.long="1"; removePlate(+b.dataset.p); },450); });
document.addEventListener("pointerup",()=>clearTimeout(pressTimer)); document.addEventListener("pointercancel",()=>clearTimeout(pressTimer));
document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-p]")) e.preventDefault(); });

function shrinkImage(file,max,cb){ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"); const sc=Math.min(1,max/Math.max(im.width,im.height)); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext("2d").drawImage(im,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",.8)); }; im.src=r.result; }; r.readAsDataURL(file); }

// ---------- 종목 추가 ----------
function renderAdd(){
  $top.replaceChildren(h(`<button class="back" id="back">뒤로</button><div class="title">종목 추가</div>`));
  const html = `<section class="sheet form">
    <div class="field"><label for="mName">이름</label><input type="text" id="mName" placeholder="예: 우리 헬스장 체스트 프레스"></div>
    <div class="eyebrow">부위 (여러 개 가능)</div><div class="chips" id="mParts">${PARTS.map(p=>`<button class="chip" data-p="${p}" aria-pressed="false">${p}</button>`).join("")}</div>
    <div class="eyebrow">장비</div><div class="seg" id="eqSeg"><button data-e="machine" aria-pressed="true">머신</button><button data-e="dumbbell" aria-pressed="false">덤벨</button><button data-e="barbell" aria-pressed="false">바벨</button><button data-e="cable" aria-pressed="false">케이블</button><button data-e="body" aria-pressed="false">맨몸</button></div>
    <div id="machineOpts"><div class="seg" id="uniSeg"><button data-u="1" aria-pressed="true">한쪽씩 (ISO)</button><button data-u="0" aria-pressed="false">양쪽 한 번에</button></div>
    <div class="seg" id="stackSeg" style="margin-top:8px"><button data-st="0" aria-pressed="true">플레이트 끼우는 머신</button><button data-st="1" aria-pressed="false">핀 꽂는 스택</button></div></div>
    <label class="photo" for="mPhoto"><span>사진 (헬스장에서 직접 찍은 사진)</span><img id="mPrev" alt="" hidden><input type="file" id="mPhoto" accept="image/*" capture="environment" hidden></label>
    <button class="primary" id="mSave">추가</button></section>`;
  $main.replaceChildren(h(html));
  let uni=true, stack=false, equip="machine", img=null;
  document.querySelector("#back").addEventListener("click",()=>go({name:"machines"}));
  const seg=(id,fn)=>$main.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener("click",()=>{ fn(b); $main.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b)); }));
  $main.querySelectorAll("#mParts .chip").forEach(c=>c.addEventListener("click",()=>c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")!=="true")));
  seg("uniSeg",b=>uni=b.dataset.u==="1"); seg("stackSeg",b=>stack=b.dataset.st==="1");
  seg("eqSeg",b=>{ equip=b.dataset.e; $main.querySelector("#machineOpts").hidden = equip!=="machine"; });
  $main.querySelector("#mPhoto").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    shrinkImage(f,480,url=>{ img=url; const p=$main.querySelector("#mPrev"); p.src=img; p.hidden=false; });
  });
  $main.querySelector("#mSave").addEventListener("click",()=>{
    const name=$main.querySelector("#mName").value.trim(); if(!name){ toast("이름을 적어줘"); return; }
    const id="m_"+Date.now();
    const parts=[...$main.querySelectorAll('#mParts .chip[aria-pressed="true"]')].map(c=>c.dataset.p); if(!parts.length){ toast("부위를 골라줘"); return; }
    state.machines.push({id,name,brand:"내 종목",group:parts[0],parts,equip,unilateral:equip==="machine"&&uni,stack:(equip==="machine"&&stack)||equip==="cable",bar:equip==="barbell"?20:undefined,img});
    save(); toast("종목 추가됨"); go({name:"log",mid:id});
  });
}

render();
</script>

</body></html>
